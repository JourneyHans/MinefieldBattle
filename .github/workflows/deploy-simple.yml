name: Deploy demo_v2

on:
  push:
    branches: [ feat/demo_v2 ]
    paths:
      - 'demo_v2/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build
        working-directory: ./demo_v2
        run: |
          npm ci
          npm run build

      - name: Deploy to GitHub Pages
        working-directory: ./demo_v2
        run: npm run deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
